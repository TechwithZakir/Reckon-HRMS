<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check in</title>
<style>
  :root { color-scheme: light dark; --accent: #6d4cff; --bg: #f4f3fb; --card: #fff; --ink: #15132b; --muted: #5a5780; }
  @media (prefers-color-scheme: dark) { :root { --bg: #07070f; --card: #15132b; --ink: #eceaff; --muted: #a9a5d6; } }
  body { margin: 0; min-height: 100vh; font-family: "Geist", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 420px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: 18px; padding: 20px; box-shadow: 0 8px 28px rgba(40,30,110,.08); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 14px; }
  .status { margin: 16px 0; font-size: 15px; }
  button { width: 100%; height: 52px; border: 0; border-radius: 14px; font-size: 16px; font-weight: 600; color: #fff; background: var(--accent); margin-top: 10px; }
  button.out { background: #3a3560; }
  button:disabled { opacity: .5; }
  #msg { margin-top: 14px; min-height: 22px; font-size: 14px; }
  .ok { color: #0f7a55; } .bad { color: #b4233f; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Attendance</h1>
    <div class="muted" id="who">Checking your status…</div>
    <div class="status" id="state"></div>
    <button id="in" disabled>Check in</button>
    <button id="out" class="out" disabled>Check out</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </div>
</main>
<script>
  const CSRF = {{ csrf_token | tojson }};
  const $ = (id) => document.getElementById(id);
  const say = (text, ok) => { $("msg").textContent = text; $("msg").className = ok ? "ok" : "bad"; };

  async function api(method, path, params) {
    const init = { method, credentials: "same-origin", headers: { "X-Frappe-CSRF-Token": CSRF, "X-Requested-With": "XMLHttpRequest" } };
    if (method === "POST") {
      init.headers["Content-Type"] = "application/x-www-form-urlencoded";
      init.body = new URLSearchParams(params || {});
    }
    const res = await fetch("/api/method/" + path + (method === "GET" && params ? "?" + new URLSearchParams(params) : ""), init);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((body._server_messages && JSON.parse(JSON.parse(body._server_messages)[0]).message) || body.message || "Request failed");
    return body.message;
  }

  function here() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve({});
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ latitude: p.coords.latitude, longitude: p.coords.longitude }),
        () => resolve({}),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    });
  }

  async function refresh() {
    const s = await api("GET", "reckon_hrms.api.attendance.my_status");
    $("who").textContent = s.employee_name + " (" + s.employee + ")";
    $("state").textContent = s.checked_in ? "You are checked in." : "You are checked out.";
    $("in").disabled = s.checked_in;
    $("out").disabled = !s.checked_in;
  }

  async function punch(type) {
    $("in").disabled = $("out").disabled = true;
    try {
      const pos = await here();
      const r = await api("POST", "reckon_hrms.api.attendance.punch", { log_type: type, ...pos });
      say(type === "IN" ? "Checked in." : "Checked out.", true);
      if (r.distance_m !== undefined) say((type === "IN" ? "Checked in" : "Checked out") + " · " + r.distance_m + " m from office", true);
    } catch (e) {
      say(e.message, false);
    } finally {
      await refresh().catch(() => {});
    }
  }

  $("in").addEventListener("click", () => punch("IN"));
  $("out").addEventListener("click", () => punch("OUT"));
  refresh().catch((e) => say(e.message, false));
</script>
</body>
</html>
